# SRU Event Hub reverse proxy. Web and API share one origin, so auth cookies are
# first-party and SameSite=Lax works without CORS. Terminate TLS in front of this
# (or add a 443 server block) – production must be HTTPS only (docs/SECURITY.md).

# Per-IP limits on top of the application's own throttling.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

upstream sru_api { server api:4000; keepalive 32; }
upstream sru_web { server web:3000; keepalive 32; }

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 10m;   # slips / attachments; API enforces per-endpoint limits

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;

  location = /api/v1/auth/login {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://sru_api;
  }

  # Swagger UI is disabled in production by the API itself.
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://sru_api;
  }

  # Socket.IO (real-time check-in counters – Phase 4)
  location /socket.io/ {
    proxy_pass http://sru_api;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location /_next/static/ {
    proxy_pass http://sru_web;
    expires 365d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://sru_web;
  }
}
