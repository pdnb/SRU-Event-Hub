# SRU Event Hub reverse proxy – Coolify variant (keep locations in sync with default.conf).
# Coolify's Traefik terminates TLS and forwards here over the internal Docker network, so:
#  - the real client IP is recovered from X-Forwarded-For (rate limits are per client, not per Traefik)
#  - the API receives a single trusted X-Forwarded-For hop (TRUST_PROXY=1)
#  - X-Forwarded-Proto keeps the original https scheme

set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

# Per-IP limits on top of the application's own throttling.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

upstream sru_api { server api:4000; keepalive 32; }
upstream sru_web { server web:3000; keepalive 32; }

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 10m;   # slips / attachments; API enforces per-endpoint limits

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header X-Request-Id $request_id;

  location = /api/v1/auth/login {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://sru_api;
  }

  # Swagger UI is disabled in production by the API itself.
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://sru_api;
  }

  # Socket.IO (real-time check-in counters – Phase 4)
  location /socket.io/ {
    proxy_pass http://sru_api;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location /_next/static/ {
    proxy_pass http://sru_web;
    expires 365d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://sru_web;
  }
}
