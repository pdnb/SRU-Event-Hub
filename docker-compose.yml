# SRU Event Hub – local / single-host deployment.
# Dev:   pnpm infra:up         (postgres, redis, storage only; run api/web with pnpm dev)
# Full:  docker compose --profile app up -d --build
name: sru-event-hub

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    ports: ['127.0.0.1:5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:${REDIS_HOST_PORT:-6379}:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  # S3-compatible object storage (SeaweedFS). MinIO community images are no longer
  # published (see docs/VERSIONS.md). Any S3 endpoint can be used in production.
  storage:
    image: chrislusf/seaweedfs:4.52
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/s3-entrypoint.sh']
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC}
    ports: ['127.0.0.1:9000:8333']
    volumes:
      - storagedata:/data
      - ./infrastructure/docker/seaweedfs-entrypoint.sh:/s3-entrypoint.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null']
      interval: 5s
      retries: 20

  # Creates buckets once: public (event images) and private (slips, badges, certificates).
  storage-init:
    image: amazon/aws-cli:2.39.4
    depends_on:
      storage: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION}
      BUCKETS: ${S3_BUCKET_PUBLIC} ${S3_BUCKET_PRIVATE}
    volumes:
      - ./infrastructure/docker/create-buckets.sh:/create-buckets.sh:ro
    entrypoint: ['/bin/sh', '/create-buckets.sh']

  # One-off release step: docker compose --profile app run --rm migrate
  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://storage:8333
      TRUST_PROXY: '1'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000/api/v1
    depends_on: [api]

  nginx:
    profiles: [app]
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports: ['80:80']
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, web]

volumes:
  pgdata:
  redisdata:
  storagedata:
